<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .bar {
            font-size: 20px;
            font-weight: bold;
            color: red;
        }
        .bar.min {
            color: blue;
        }
        form {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Weather Report for 2024 - Month July</h1>

    <form>
        <label>Enter Year:</label>
        <input type="number" name="year" value="2024" required>
        
        <label>Select Month:</label>
        <select name="month">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7" selected>July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
        
        <button type="submit">Get Report</button>
    </form>

    <h2>Average Max Temperature: 32°C</h2>
    <div class="bar">⭐⭐⭐⭐⭐⭐⭐⭐⭐</div>

    <h2>Average Min Temperature: 18°C</h2>
    <div class="bar min">⭐⭐⭐⭐⭐⭐</div>

    <hr>

    <h2>Extreme Weather Data for 2024</h2>
    <p><strong>Highest Temperature: 40°C on 15 July</strong></p>
    <p><strong>Lowest Temperature: 10°C on 4 January</strong></p>
    <p><strong>Most Humid Day: 90% on 21 August</strong></p>

</body>
</html>
